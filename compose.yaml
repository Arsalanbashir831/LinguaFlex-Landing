services:
  web:
    build: .
    image: linguaflex-landing:latest
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 5
